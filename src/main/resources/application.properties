spring.application.name=pdfeditor
server.port=8083

# Java 25 compatibility - ignore class format issues
spring.classformat.ignore=true

# Swagger/OpenAPI settings
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Logging - file output for production
logging.level.org.springdoc=WARN
logging.level.root=INFO
logging.level.com.upas.pdfeditor=DEBUG
springdoc.packages-to-scan=com.upas.pdfeditor
springdoc.api-docs.path=/v3/api-docs

# Log file configuration
logging.file.name=logs/pdfeditor.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Server optimization
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
